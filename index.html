@font-face{font-family:'JetBrains Mono';font-display:swap;font-weight:400;src:url(fonts/jetbrains-mono-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'JetBrains Mono';font-display:swap;font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'JetBrains Mono';font-display:swap;font-weight:700;src:url(fonts/jetbrains-mono-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'JetBrains Mono';font-display:swap;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#050605;--card:#0d110d;--card2:#121812;--line:#1f2a1f;--text:#e9f0e9;--muted:#8c988c;--acc:#2ee66b;--acc-d:#14361f;--pixel:'Press Start 2P',monospace;--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 var(--mono);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;height:auto;display:block}
.shot,.gal{width:100%;max-width:960px;margin-left:auto;margin-right:auto}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.px{font-family:var(--pixel);font-weight:400;letter-spacing:0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font:700 14px var(--mono);text-decoration:none;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px);background:#182018}
.btn.main{background:var(--acc);color:#04120a;border-color:var(--acc)}
.btn.main:hover{background:#4bf082}
.btn svg{width:18px;height:18px;flex:none}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--acc-d);color:var(--acc);font-size:12px;font-weight:700}
/* шапка */
header{position:sticky;top:0;z-index:5;background:rgba(5,6,5,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:22px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--pixel);font-size:13px}
.logo img{width:30px;height:30px;border-radius:8px}
.links{display:flex;gap:20px;margin-left:auto;font-size:13px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--text)}
.lang{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font-size:11px;padding:3px 8px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--acc-d);color:var(--acc)}
.bar .btn{padding:8px 16px;font-size:13px}
/* перший екран */
.hero{padding:72px 0 40px;text-align:center}
.hero h1{font-family:var(--pixel);font-weight:400;font-size:clamp(22px,3.6vw,40px);line-height:1.45;margin:22px auto 18px;max-width:900px}
.hero h1 b{color:var(--acc);font-weight:400}
.hero p.lead{color:var(--muted);font-size:17px;max-width:620px;margin:0 auto 30px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.meta{margin-top:14px;color:var(--muted);font-size:12px}
.shot{margin:48px auto 0;border-radius:16px;border:1px solid var(--line);overflow:hidden;box-shadow:0 30px 80px -30px rgba(46,230,107,.25)}
/* секції */
section{padding:72px 0}
.kicker{font-family:var(--pixel);font-size:11px;color:var(--acc);margin-bottom:14px}
h2{font-size:clamp(22px,3vw,30px);line-height:1.3;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 34px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.f{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.f svg{width:26px;height:26px;color:var(--acc)}
.f h3{margin:12px 0 6px;font-size:16px}
.f p{margin:0;color:var(--muted);font-size:13.5px}
/* галерея */
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--acc-d);border-color:var(--acc-d);color:var(--acc)}
.gal{border-radius:16px;border:1px solid var(--line);overflow:hidden}
/* встановлення */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;position:relative}
.step::before{counter-increment:s;content:counter(s);font-family:var(--pixel);font-size:14px;color:#04120a;background:var(--acc);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-bottom:12px}
.step h3{margin:0 0 6px;font-size:15px}.step p{margin:0;color:var(--muted);font-size:13.5px}
.ss{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:center;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
.ss h3{margin:0 0 8px;font-size:17px}.ss p{margin:0 0 10px;color:var(--muted);font-size:14px}
.ss ol{margin:0;padding-left:20px;font-size:14px}.ss li{margin:4px 0}
.win{background:#0a4a8c;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;border-radius:6px;padding:22px 24px 18px;font-size:13px;line-height:1.5}
.win .t{font-size:22px;font-weight:300;margin-bottom:12px}
.win .u{text-decoration:underline;font-weight:600;outline:2px dashed #ffd84d;outline-offset:3px;border-radius:2px}
.win .r{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.win .r span{border:1px solid #fff;padding:5px 16px;font-size:12px}
.win .r span.hl{outline:2px dashed #ffd84d;outline-offset:3px}
.win .arr{color:#ffd84d;font-weight:700;margin:8px 0 0}
/* ціни */
.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:820px}
.price{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
.price.now{border-color:var(--acc)}
.price .n{font-family:var(--pixel);font-size:22px;margin:14px 0 6px}
.price ul{margin:14px 0 20px;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.price li{padding:3px 0 3px 22px;position:relative}
.price li::before{content:"";position:absolute;left:2px;top:10px;width:9px;height:5px;border:2px solid var(--acc);border-top:0;border-right:0;transform:rotate(-45deg)}
.price.soon{opacity:.75}
/* питання */
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";color:var(--acc);font-family:var(--pixel);font-size:12px}
details[open] summary::after{content:"−"}
details p{color:var(--muted);margin:10px 0 0;font-size:14px}
.trust{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;margin:22px 0 0;padding:0;font-size:13px;color:var(--muted)}
.trust li{display:flex;align-items:center;gap:8px}.trust svg{width:18px;height:18px;color:var(--acc)}
video.shot{display:block;width:100%;max-width:960px;height:auto;background:#000}
.zoom{cursor:zoom-in}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:18px}
.dots button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 15px 7px 8px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.dots i{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.dots button.on{color:var(--text);border-color:var(--c)}
.nl{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:14px}.nl li{margin:4px 0}
#news summary .pill{margin-left:8px;font-size:11px;padding:2px 10px}
#lb{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh;overflow:visible}
#lb::backdrop{background:rgba(0,0,0,.85)}
#lb .lbx>*{width:min(96vw,150vh);border-radius:10px;overflow:hidden;cursor:zoom-out}
#lb .lbx img{width:100%;height:auto}
.live{position:relative;display:block}.live img{width:100%;height:auto;display:block}
.live .torus,.live .cdlw{position:absolute;pointer-events:none}
.cdlw .candles{width:100%;height:100%;display:block}
.candles .cdl{animation:cdlgrow 4.5s ease-in-out infinite}.candles .cdl line{stroke-width:2}
.candles .up rect{fill:#1fd65f}.candles .up line{stroke:#1fd65f}.candles .dn rect{fill:#d0423a}.candles .dn line{stroke:#d0423a}
.candles .trend{fill:none;stroke:#e9e9e9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;animation:cdltrend 4.5s ease-in-out infinite}
@keyframes cdlgrow{0%,6%{transform:scaleY(0)}28%,86%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes cdltrend{0%,25%{stroke-dashoffset:300}55%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:300}}
@media (prefers-reduced-motion:reduce){.candles .cdl,.candles .trend{animation:none}}
#lb button{all:unset;cursor:pointer;position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#04120a;font-size:22px;line-height:34px;text-align:center}
footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.quote{font-family:var(--pixel);font-size:10px;line-height:2}.quote b{color:var(--acc);font-weight:400}
@media (max-width:900px){.links{display:none}.lang{margin-left:auto}.grid{grid-template-columns:1fr 1fr}.ss{grid-template-columns:1fr}}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
@media (max-width:600px){.grid,.steps,.prices{grid-template-columns:1fr}.bar .btn span{display:none}.hero{padding-top:44px}section{padding:52px 0}.logo span{display:none}}
</style>
</head>

if (SHOP.buy) { const p = document.getElementById('paid'); p.classList.remove('soon'); p.querySelector('.n').textContent = SHOP.price; p.insertAdjacentHTML('beforeend', `<a class="btn main" href="${SHOP.url}">${{uk: 'Купити', ru: 'Купить', en: 'Buy'}[lang]}</a>`); }
</script>
